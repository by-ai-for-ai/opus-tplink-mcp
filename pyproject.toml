[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opus-tplink-mcp"
version = "1.1.0"
description = "Built by AI, for AI: a safety-first MCP server for TP-Link Archer (BE series) routers and RE range extenders - 33 tools, dry runs, confirm tokens, journal and undo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "vehoelite"}
]
maintainers = [
    {name = "vehoelite"}
]
keywords = [
    "tplink",
    "router",
    "automation",
    "port-forwarding",
    "mcp",
    "model-context-protocol",
    "home-automation",
    "network",
    "range-extender",
    "easymesh",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.5.0,<2",  # 2.x removed the low-level Server decorators this server uses
    "tplinkrouterc6u>=5.23,<6",
    "requests>=2.31.0",
    "pycryptodome>=3.19",  # extender protocols (RSA-OAEP, AES, HMAC)
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
mcp-tplink-router = "mcp_tplink_router:main"
opus-tplink-mcp = "mcp_tplink_router:main"

[project.urls]
Homepage = "https://github.com/by-ai-for-ai/opus-tplink-mcp"
Repository = "https://github.com/by-ai-for-ai/opus-tplink-mcp"
Documentation = "https://github.com/by-ai-for-ai/opus-tplink-mcp#readme"
Issues = "https://github.com/by-ai-for-ai/opus-tplink-mcp/issues"
Changelog = "https://github.com/by-ai-for-ai/opus-tplink-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tplink_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tplinkrouterc6u.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict
    "SIM105", # try/except/pass is clearer than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"src/mcp_tplink_router/_endpoints.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_tplink_router"]

[tool.coverage.run]
source = ["src/mcp_tplink_router"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
