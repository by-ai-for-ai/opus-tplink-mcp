# opus-tplink-mcp field reports -> local service (no access log: it would keep IP addresses)
location /api/opus-tplink-mcp/ {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8790/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # real_ip module: trusts CF-Connecting-IP only from Cloudflare ranges
    proxy_read_timeout 10s;
}
