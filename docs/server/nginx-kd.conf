# opus-tplink-mcp shared device names. DNS-only on purpose: TLS ends here, not at a CDN.
# No access log anywhere (it would keep IP addresses).
server {
    listen <server-ip>:80;
    server_name kd.by-ai-for-ai.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /www/wwwroot/kd-acme; }
    location / { return 301 https://$host$request_uri; }
}

# Rate limit kept in memory (no log of normal requests). Only a client OVER the limit is written to
# /var/log/nginx-kd/limit.log (rotated daily, nothing older than a day) so fail2ban can ban it.
limit_req_zone $binary_remote_addr zone=kd:2m rate=20r/m;
server {
    listen <server-ip>:443 ssl http2;
    server_name kd.by-ai-for-ai.com;
    ssl_certificate     /etc/letsencrypt/live/kd.by-ai-for-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kd.by-ai-for-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx-kd/limit.log warn;
    limit_req zone=kd burst=10 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    location = /known-devices {
        if ($request_method != POST) { return 405; }   # no log line (deny would log the client IP)
        proxy_pass http://127.0.0.1:8790/known-devices;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }
    location = /known-devices.json {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8790/known-devices.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
